spark.master                         yarn
spark.yarn.queue                     etl
# jar-ы Spark лежат в HDFS одним архивом: иначе каждый запуск заливает ~300 МБ заново
spark.yarn.archive                   hdfs:///spark/spark-libs.zip
spark.eventLog.enabled               true
spark.eventLog.dir                   hdfs:///spark/events
spark.history.fs.logDirectory        hdfs:///spark/events

# Ресурсы подогнаны под NodeManager на 3 ГБ: драйвер 512 МБ + 384 накладных,
# два исполнителя по 640 + 384. YARN округляет до 256 МБ, итого ровно 3 ГБ.
spark.driver.memory                  512m
spark.executor.memory                640m
spark.executor.cores                 2
spark.executor.instances             2

# Один каталог на Hive-таблицы и Iceberg: raw (внешние Parquet) и ods (Iceberg)
# живут в одном Metastore и видны из Spark, HiveServer2 и Trino одинаково.
spark.sql.catalogImplementation      hive
spark.hadoop.hive.metastore.uris     thrift://metastore:9083
spark.sql.warehouse.dir              hdfs://namenode:8020/warehouse
spark.sql.extensions                 org.apache.iceberg.spark.extensions.IcebergSparkSessionExtensions
spark.sql.catalog.spark_catalog      org.apache.iceberg.spark.SparkSessionCatalog
spark.sql.catalog.spark_catalog.type hive

spark.sql.session.timeZone           Asia/Almaty
spark.yarn.appMasterEnv.PYSPARK_PYTHON  python3
spark.executorEnv.PYSPARK_PYTHON        python3
