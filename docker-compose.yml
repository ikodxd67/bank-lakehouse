name: bank-lakehouse

# Весь стек в 8 ГБ Docker не помещается, поэтому сервисы разбиты на профили:
#   (без профиля)  источник
#   cdc            Kafka и Kafka Connect с Debezium
#   hadoop         HDFS, YARN, Hive Metastore, Spark History Server
#   hive           HiveServer2 (SQL поверх raw и ods)
#   gp             Greenplum (Greengage)
#   airflow        оркестрация

x-hadoop: &hadoop
  image: bank-lakehouse/hadoop:local
  build: docker/hadoop
  profiles: [hadoop]
  restart: unless-stopped

services:
  source-db:
    image: postgres:16
    command:
      - postgres
      - -c
      - wal_level=logical
      - -c
      - max_replication_slots=4
      - -c
      - max_wal_senders=4
      - -c
      - shared_buffers=512MB
      - -c
      - max_wal_size=4GB
      - -c
      - timezone=Asia/Almaty
    environment:
      POSTGRES_USER: bank
      POSTGRES_PASSWORD: bank
      POSTGRES_DB: core
    ports: ["5433:5432"]
    volumes: [source-data:/var/lib/postgresql/data]
    shm_size: 256mb
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "bank", "-d", "core"]
      interval: 5s
      retries: 20
    restart: unless-stopped

  kafka:
    image: apache/kafka:4.2.2
    profiles: [cdc]
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      # kafka:19092 для контейнеров, localhost:9092 для хоста
      KAFKA_LISTENERS: INTERNAL://:19092,EXTERNAL://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:19092,EXTERNAL://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_NUM_PARTITIONS: 3
      # из Kafka данные забирает Spark каждый час; три дня — запас на простой
      KAFKA_LOG_RETENTION_HOURS: 72
      KAFKA_HEAP_OPTS: -Xmx512m -Xms256m
    ports: ["9092:9092"]
    volumes: [kafka-data:/var/lib/kafka/data]
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list"]
      interval: 10s
      timeout: 10s
      retries: 12
    restart: unless-stopped

  connect:
    image: bank-lakehouse/connect:local
    build: docker/connect
    profiles: [cdc]
    environment:
      KAFKA_HEAP_OPTS: -Xmx512m -Xms256m
    ports: ["8083:8083"]
    depends_on:
      kafka: {condition: service_healthy}
      source-db: {condition: service_healthy}
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8083/connectors > /dev/null"]
      interval: 10s
      timeout: 5s
      retries: 30
    restart: unless-stopped

  namenode:
    <<: *hadoop
    command: ["hdfs", "namenode"]
    environment:
      # starter.sh образа форматирует NameNode, если этого каталога ещё нет
      ENSURE_NAMENODE_DIR: /hadoop/dfs/name/current
      HADOOP_HEAPSIZE_MAX: 512m
    ports: ["9870:9870"]
    volumes: [hdfs-name:/hadoop/dfs/name]
    healthcheck:
      test: ["CMD-SHELL", "hdfs dfsadmin -safemode get | grep -q OFF"]
      interval: 10s
      timeout: 10s
      retries: 30

  datanode:
    <<: *hadoop
    command: ["hdfs", "datanode"]
    environment:
      HADOOP_HEAPSIZE_MAX: 512m
    volumes: [hdfs-data:/hadoop/dfs/data]
    depends_on: [namenode]

  resourcemanager:
    <<: *hadoop
    command: ["yarn", "resourcemanager"]
    environment:
      HADOOP_HEAPSIZE_MAX: 512m
    ports: ["8088:8088"]
    depends_on: [namenode]

  nodemanager:
    <<: *hadoop
    command: ["yarn", "nodemanager"]
    environment:
      HADOOP_HEAPSIZE_MAX: 256m
    ports: ["8042:8042"]
    depends_on: [resourcemanager]

  hdfs-init:
    <<: *hadoop
    restart: "no"
    command: ["bash", "/opt/scripts/hdfs-init.sh"]
    volumes: [./docker/hadoop/scripts:/opt/scripts:ro]
    depends_on:
      namenode: {condition: service_healthy}
      datanode: {condition: service_started}

  historyserver:
    <<: *hadoop
    command: ["/opt/spark/bin/spark-class", "org.apache.spark.deploy.history.HistoryServer"]
    environment:
      SPARK_DAEMON_MEMORY: 384m
    ports: ["18080:18080"]
    depends_on:
      hdfs-init: {condition: service_completed_successfully}

  metastore-db:
    image: postgres:16
    profiles: [hadoop]
    environment:
      POSTGRES_USER: hive
      POSTGRES_PASSWORD: hive
      POSTGRES_DB: metastore
    volumes: [metastore-data:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "hive", "-d", "metastore"]
      interval: 5s
      retries: 20
    restart: unless-stopped

  metastore:
    image: bank-lakehouse/hive:local
    build: {context: docker, dockerfile: hive/Dockerfile}
    profiles: [hadoop]
    environment:
      SERVICE_NAME: metastore
      DB_DRIVER: postgres
      SERVICE_OPTS: -Xmx512m
    ports: ["9083:9083"]
    depends_on:
      metastore-db: {condition: service_healthy}
      namenode: {condition: service_healthy}
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'echo > /dev/tcp/localhost/9083'"]
      interval: 10s
      retries: 30
    restart: unless-stopped

  hiveserver2:
    image: bank-lakehouse/hive:local
    build: {context: docker, dockerfile: hive/Dockerfile}
    profiles: [hive]
    environment:
      SERVICE_NAME: hiveserver2
      IS_RESUME: "true"
      SERVICE_OPTS: -Xmx1G
    ports: ["10000:10000", "10002:10002"]
    depends_on:
      metastore: {condition: service_healthy}
    restart: unless-stopped

volumes:
  source-data:
  kafka-data:
  hdfs-name:
  hdfs-data:
  metastore-data:
