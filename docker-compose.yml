name: bank-lakehouse

# Весь стек в 8 ГБ Docker не помещается, поэтому сервисы разбиты на профили:
#   (без профиля)  источник
#   cdc            Kafka и Kafka Connect с Debezium
#   hadoop         HDFS, YARN, Hive Metastore, Spark History Server
#   hive           HiveServer2 (SQL поверх raw и ods)
#   gp             Greenplum (Greengage)
#   airflow        оркестрация

x-airflow: &airflow
  image: bank-lakehouse/airflow:local
  build: {context: docker, dockerfile: airflow/Dockerfile}
  profiles: [airflow]
  environment:
    AIRFLOW__CORE__EXECUTOR: LocalExecutor
    AIRFLOW__CORE__LOAD_EXAMPLES: "false"
    AIRFLOW__CORE__DAGS_FOLDER: /opt/airflow/dags
    AIRFLOW__CORE__PARALLELISM: "4"
    AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:airflow@airflow-db:5432/airflow
    AIRFLOW__API_AUTH__JWT_SECRET: local-only-not-a-secret
    AIRFLOW__CORE__EXECUTION_API_SERVER_URL: http://airflow-apiserver:8080/execution/
    AIRFLOW__CORE__SIMPLE_AUTH_MANAGER_ALL_ADMINS: "true"
    # spark-submit уходит в YARN, драйвер работает в кластере (deploy-mode cluster)
    AIRFLOW_CONN_SPARK_YARN: '{"conn_type": "spark", "host": "yarn", "extra": {"queue": "etl", "deploy-mode": "cluster", "yarn_resourcemanager_webapp_address": "http://resourcemanager:8088"}}'
    PYTHONPATH: /opt/bank/src
    BANK_PROJECT_DIR: /opt/bank
    BANK_SOURCE_DSN: postgresql://bank:bank@source-db:5432/core
    BANK_GP_DSN: postgresql://gpadmin:gpadmin@greenplum:5432/dwh
    BANK_WEBHDFS_URL: http://namenode:9870
    GP_HOST: greenplum
    GP_PORT: "5432"
  volumes:
    - ./dags:/opt/airflow/dags:ro
    - ./src:/opt/bank/src:ro
    - ./spark:/opt/bank/spark:ro
    - ./dbt:/opt/bank/dbt:ro
    - ./sql:/opt/bank/sql:ro
    - airflow-logs:/opt/airflow/logs
  depends_on:
    airflow-db: {condition: service_healthy}

x-hadoop: &hadoop
  image: bank-lakehouse/hadoop:local
  build: docker/hadoop
  profiles: [hadoop]
  restart: unless-stopped
  volumes:
    - ./spark:/opt/bank/spark:ro

services:
  source-db:
    image: postgres:16
    command:
      - postgres
      - -c
      - wal_level=logical
      - -c
      - max_replication_slots=4
      - -c
      - max_wal_senders=4
      - -c
      - shared_buffers=512MB
      - -c
      - max_wal_size=4GB
      - -c
      - timezone=Asia/Almaty
    environment:
      POSTGRES_USER: bank
      POSTGRES_PASSWORD: bank
      POSTGRES_DB: core
    ports: ["5433:5432"]
    volumes: [source-data:/var/lib/postgresql/data]
    shm_size: 256mb
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "bank", "-d", "core"]
      interval: 5s
      retries: 20
    restart: unless-stopped

  kafka:
    image: apache/kafka:4.2.2
    profiles: [cdc]
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      # kafka:19092 для контейнеров, localhost:9092 для хоста
      KAFKA_LISTENERS: INTERNAL://:19092,EXTERNAL://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:19092,EXTERNAL://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_NUM_PARTITIONS: 3
      # из Kafka данные забирает Spark каждый час; три дня — запас на простой
      KAFKA_LOG_RETENTION_HOURS: 72
      KAFKA_HEAP_OPTS: -Xmx512m -Xms256m
      # по умолчанию образ пишет журналы в /tmp внутри контейнера: том был пустым,
      # и пересоздание контейнера стёрло бы топики вместе со смещениями Connect
      KAFKA_LOG_DIRS: /var/lib/kafka/data
    ports: ["9092:9092"]
    volumes: [kafka-data:/var/lib/kafka/data]
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list"]
      interval: 10s
      timeout: 10s
      retries: 12
    restart: unless-stopped

  # живой процессинг: новые авторизации, подтверждения, снятие холдов, правки клиентов
  simulator:
    image: bank-lakehouse/simulator:local
    build: {context: ., dockerfile: docker/simulator/Dockerfile}
    profiles: [cdc]
    command: ["bank", "simulate", "--tick", "10", "--tps", "20"]
    environment:
      BANK_SOURCE_DSN: postgresql://bank:bank@source-db:5432/core
    depends_on:
      source-db: {condition: service_healthy}
    restart: unless-stopped

  connect:
    image: bank-lakehouse/connect:local
    build: docker/connect
    profiles: [cdc]
    environment:
      KAFKA_HEAP_OPTS: -Xmx512m -Xms256m
    ports: ["8083:8083"]
    depends_on:
      kafka: {condition: service_healthy}
      source-db: {condition: service_healthy}
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8083/connectors > /dev/null"]
      interval: 10s
      timeout: 5s
      retries: 30
    restart: unless-stopped

  namenode:
    <<: *hadoop
    command: ["hdfs", "namenode"]
    environment:
      # starter.sh образа форматирует NameNode, если этого каталога ещё нет
      ENSURE_NAMENODE_DIR: /hadoop/dfs/name/current
      HADOOP_HEAPSIZE_MAX: 512m
    ports: ["9870:9870"]
    volumes: [hdfs-name:/hadoop/dfs/name, ./spark:/opt/bank/spark:ro]
    healthcheck:
      test: ["CMD-SHELL", "hdfs dfsadmin -safemode get | grep -q OFF"]
      interval: 10s
      timeout: 10s
      retries: 30

  datanode:
    <<: *hadoop
    command: ["hdfs", "datanode"]
    environment:
      HADOOP_HEAPSIZE_MAX: 512m
    volumes: [hdfs-data:/hadoop/dfs/data, ./spark:/opt/bank/spark:ro]
    depends_on: [namenode]

  resourcemanager:
    <<: *hadoop
    command: ["yarn", "resourcemanager"]
    environment:
      HADOOP_HEAPSIZE_MAX: 512m
    ports: ["8088:8088"]
    depends_on: [namenode]

  nodemanager:
    <<: *hadoop
    command: ["yarn", "nodemanager"]
    environment:
      HADOOP_HEAPSIZE_MAX: 256m
    ports: ["8042:8042"]
    depends_on: [resourcemanager]

  hdfs-init:
    <<: *hadoop
    restart: "no"
    command: ["bash", "/opt/scripts/hdfs-init.sh"]
    volumes: [./docker/hadoop/scripts:/opt/scripts:ro]
    depends_on:
      namenode: {condition: service_healthy}
      datanode: {condition: service_started}

  historyserver:
    <<: *hadoop
    command: ["/opt/spark/bin/spark-class", "org.apache.spark.deploy.history.HistoryServer"]
    environment:
      SPARK_DAEMON_MEMORY: 384m
    ports: ["18080:18080"]
    depends_on:
      hdfs-init: {condition: service_completed_successfully}

  metastore-db:
    image: postgres:16
    profiles: [hadoop]
    environment:
      POSTGRES_USER: hive
      POSTGRES_PASSWORD: hive
      POSTGRES_DB: metastore
    volumes: [metastore-data:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "hive", "-d", "metastore"]
      interval: 5s
      retries: 20
    restart: unless-stopped

  metastore:
    image: bank-lakehouse/hive:local
    build: {context: docker, dockerfile: hive/Dockerfile}
    profiles: [hadoop]
    environment:
      SERVICE_NAME: metastore
      DB_DRIVER: postgres
      SERVICE_OPTS: -Xmx512m
    ports: ["9083:9083"]
    depends_on:
      metastore-db: {condition: service_healthy}
      namenode: {condition: service_healthy}
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'echo > /dev/tcp/localhost/9083'"]
      interval: 10s
      retries: 30
    restart: unless-stopped

  hiveserver2:
    image: bank-lakehouse/hive:local
    build: {context: docker, dockerfile: hive/Dockerfile}
    profiles: [hive]
    environment:
      SERVICE_NAME: hiveserver2
      IS_RESUME: "true"
      SERVICE_OPTS: -Xmx1G
    ports: ["10000:10000", "10002:10002"]
    depends_on:
      metastore: {condition: service_healthy}
    restart: unless-stopped

  greenplum:
    # Greengage — открытый форк Greenplum 7 от Arenadata (исходники Greenplum закрыты в 2024)
    image: woblerr/greengage:7.5.0
    profiles: [gp]
    # имя хоста записывается в конфигурацию кластера при инициализации;
    # случайное имя контейнера после пересоздания сломало бы запуск сегментов
    hostname: greenplum
    environment:
      GREENPLUM_PASSWORD: gpadmin
      GREENPLUM_DATABASE_NAME: dwh
      GREENPLUM_PXF_ENABLE: "true"
      # при перезапуске контейнера `pxf cluster start` подключается к базе по TCP и
      # без пароля падает, а вместе с ним и весь контейнер (цикл перезапусков)
      PGPASSWORD: gpadmin
      TZ: Asia/Almaty
    ports: ["5434:5432"]
    volumes:
      - gp-data:/data
      - ./docker/greenplum/init:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "su - gpadmin -c \"psql -d dwh -tAc 'select 1'\""]
      interval: 10s
      timeout: 10s
      retries: 60
    restart: unless-stopped

  airflow-db:
    image: postgres:16
    profiles: [airflow]
    environment:
      POSTGRES_USER: airflow
      POSTGRES_PASSWORD: airflow
      POSTGRES_DB: airflow
    volumes: [airflow-db-data:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "airflow"]
      interval: 5s
      retries: 20
    restart: unless-stopped

  airflow-init:
    <<: *airflow
    command: db migrate
    restart: "no"

  airflow-apiserver:
    <<: *airflow
    command: api-server
    ports: ["8080:8080"]
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost:8080/api/v2/version"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 60s
    depends_on:
      airflow-init: {condition: service_completed_successfully}
    restart: unless-stopped

  airflow-scheduler:
    <<: *airflow
    command: scheduler
    depends_on:
      airflow-init: {condition: service_completed_successfully}
    restart: unless-stopped

  # в Airflow 3 разбор DAG-файлов — отдельный процесс
  airflow-dag-processor:
    <<: *airflow
    command: dag-processor
    depends_on:
      airflow-init: {condition: service_completed_successfully}
    restart: unless-stopped

volumes:
  airflow-db-data:
  airflow-logs:
  gp-data:
  source-data:
  kafka-data:
  hdfs-name:
  hdfs-data:
  metastore-data:
