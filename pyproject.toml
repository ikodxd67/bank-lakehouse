[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "bank-lakehouse"
version = "0.1.0"
description = "Карточный процессинг: PostgreSQL -> Debezium -> Kafka -> HDFS/Hive -> Iceberg -> Greenplum"
requires-python = ">=3.11"
dependencies = [
    "psycopg[binary]>=3.2",
    "httpx>=0.27",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dbt = ["dbt-postgres>=1.10,<1.12"]
dev = [
    "pytest>=8.2",
    "ruff>=0.6",
]

[project.scripts]
bank = "bank_lakehouse.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 120
target-version = "py311"
src = ["src", "tests", "dags", "spark/pyspark"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "RUF"]
ignore = ["RUF001", "RUF002", "RUF003"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "integration: нужен поднятый стенд docker compose",
]
